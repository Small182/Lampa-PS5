# Ad-block filter lists bundled into dist/prosperoweb/addons by
# scripts/ps5/addons/stage-addons.sh.
#
#   kind  name              sha256  url
#
# kind: ads      merged into the ads ruleset AND refetched on-device by the
#                online updater (host must be reachable from the console).
#       adsx     merged into the bundled ads ruleset ONLY, not refetched on
#                device (the console cannot reach raw.githubusercontent.com -
#                it hangs - so the uBlock uAssets lists are shipped in the
#                snapshot, built here, but left out of the update fetch set).
#       cookie   the cookie-banner set, bundled AND refetched on device.
#       cookiex  cookie-banner set bundled ONLY, not refetched (its host
#                secure.fanboy.co.nz hangs on the console like GitHub).
#
# EasyList + EasyPrivacy (GPLv3 / CC BY-SA 3.0) and uBlock Origin's own default
# lists from uAssets (GPLv3) are merged for the best page-ad / YouTube coverage.
# These are LIVE, frequently-updated lists, so the sha256 pins a point-in-time
# SNAPSHOT (the bundled baseline). The on-device updater refetches the same
# URLs fresh and rebuilds with the same converter (core::adblock). Downloaded
# text is untrusted data: only parsed, never executed. Set ADDONS_ALLOW_
# UNPINNED=1 to take whatever upstream serves now after a drift.
#
# Snapshot pinned 2026-11-09.

